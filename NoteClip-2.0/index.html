<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#005b3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NoteClip 2.0">
    <title>NoteClip 2.0</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">Pest service note composer</p>
          <h1>NoteClip 2.0</h1>
        </div>
        <div class="header-actions">
          <button class="header-reset-button" id="topResetButton" type="button">Reset form</button>
        </div>
      </header>

      <section class="workspace" aria-label="Note builder">
        <form class="builder" id="noteForm">
          <section class="panel" aria-labelledby="issuesTitle">
            <div class="panel-heading">
              <p class="step-label">Service findings</p>
              <h2 id="issuesTitle" class="visually-hidden">Service findings</h2>
            </div>
            <div class="pill-stack area-stack" id="issueList" aria-label="Service area"></div>
            <div class="sub-panel is-hidden" id="exteriorPanel" aria-labelledby="exteriorTitle">
              <h3 id="exteriorTitle">Exterior findings</h3>
              <div class="finding-list" id="exteriorIssueList" aria-label="Exterior pest issues"></div>
            </div>
            <div class="sub-panel is-hidden" id="interiorPanel" aria-labelledby="interiorTitle">
              <h3 id="interiorTitle">Interior findings</h3>
              <div class="finding-list" id="interiorIssueList" aria-label="Interior pest issues"></div>
            </div>
            <div class="sub-panel is-hidden" id="mosquitoPanel" aria-labelledby="mosquitoTitle">
              <h3 id="mosquitoTitle">Mosquito service</h3>
              <div class="finding-list" id="mosquitoIssueList" aria-label="Mosquito service options"></div>
            </div>
          </section>

          <section class="panel" id="conditionsPanel" aria-labelledby="conditionsTitle">
            <div class="panel-heading">
              <p class="step-label">Property conditions</p>
              <h2 id="conditionsTitle" class="visually-hidden">Property conditions</h2>
            </div>
            <button class="reveal-button" id="conditionsToggle" type="button" aria-expanded="false" aria-controls="conditionListWrap">Add conducive conditions</button>
            <div class="sub-panel is-hidden" id="conditionListWrap">
              <div class="pill-stack" id="conditionList" aria-label="Conducive conditions"></div>
            </div>
          </section>

          <section class="panel compact" aria-labelledby="gateTitle">
            <div class="panel-heading">
              <p class="step-label">Access note</p>
              <h2 id="gateTitle" class="visually-hidden">Access note</h2>
            </div>
            <div class="segmented" id="gateList" aria-label="Gate status"></div>
          </section>

          <section class="panel" aria-labelledby="houseTitle">
            <div class="panel-heading">
              <p class="step-label">Technician detail</p>
              <h2 id="houseTitle" class="visually-hidden">House specific detail</h2>
            </div>
            <label class="text-field">
              <span>What made this house unique today?</span>
              <textarea id="houseSpecific" rows="5" placeholder="Example: heavy ghost ant trail by kitchen window, treated lanai corners, customer asked about webs near pool cage."></textarea>
            </label>
          </section>
        </form>

        <aside class="output" aria-label="Generated note">
          <section class="note-preview">
            <div class="preview-heading">
              <div>
                <p class="step-label">Generated note</p>
                <h2>Customer-ready service note</h2>
              </div>
              <button class="utility-button" id="resetButton" type="button">Reset</button>
            </div>
            <p class="generated-note-text" id="generatedNote" aria-label="Generated service note"></p>
          </section>
        </aside>
      </section>
    </main>

    <footer class="note-actions" aria-label="Note actions">
      <div class="note-actions__inner">
        <div class="status-pill" id="copyStatus" role="status" aria-live="polite" aria-atomic="true">Ready</div>
        <div class="action-row">
          <button class="secondary-button action-tool" id="generateButton" type="button" aria-label="Generate note" title="Generate another wording">
            <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
              <path d="M8 16H3v5"></path>
            </svg>
            <span>Reword</span>
          </button>
          <button class="primary-button action-copy" id="copyNoteButton" type="button" title="Copy the displayed note">
            <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
            </svg>
            <span>Copy note</span>
          </button>
          <button class="secondary-button action-tool" id="copyPromptButton" type="button" title="Copy the AI polish prompt">
            <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <path d="M12 11h4"></path>
              <path d="M12 16h4"></path>
              <path d="M8 11h.01"></path>
              <path d="M8 16h.01"></path>
            </svg>
            <span>Copy Prompt</span>
          </button>
        </div>
      </div>
    </footer>

    <script src="note-generator.js"></script>
    <script src="script.js"></script>
  </body>
</html>
